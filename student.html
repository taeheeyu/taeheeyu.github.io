<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생 자기소개 | 손그림 포트폴리오</title>
  <meta name="description" content="금천고 학생의 손그림 포트폴리오와 작품 이야기를 만나보세요.">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="student-page-body">

  <!-- Header Navigation -->
  <header class="student-page-header">
    <a href="index.html" class="back-btn">
      <span>⬅</span> 메인 홈으로
    </a>

    <div class="student-selector-nav">
      <button id="prevStudentBtn" class="student-nav-btn">◀ 이전 친구</button>
      <button id="nextStudentBtn" class="student-nav-btn">다음 친구 ▶</button>
    </div>
  </header>

  <!-- Main Stage Viewport Fit -->
  <main class="student-viewport">
    <div class="student-stage">
      
      <!-- Left Post-it Column -->
      <div class="drawings-column left-side" id="leftDrawingsCol">
        <!-- Rendered dynamically by js/student.js -->
      </div>

      <!-- Center Area: Name on Top, Student Portrait Below -->
      <div class="center-area" id="centerArea">
        <div class="center-name-frame">
          <img id="centerNameImg" src="" alt="학생 이름" class="center-name-img">
          <span id="centerNameFallback" class="center-name-fallback" style="display:none;"></span>
        </div>
        <div class="center-student-frame">
          <img id="centerStudentImg" src="" alt="학생 이미지" class="center-student-img">
        </div>
      </div>

      <!-- Right Post-it Column -->
      <div class="drawings-column right-side" id="rightDrawingsCol">
        <!-- Rendered dynamically by js/student.js -->
      </div>

    </div>
  </main>

  <!-- Drawing Detail Popup Modal -->
  <div class="modal-overlay" id="drawingModal">
    <div class="modal-content">
      <button class="modal-close-btn" id="modalCloseBtn" aria-label="닫기">✕</button>

      <div class="modal-header">
        <span class="modal-student-tag" id="modalStudentName">학생 작품</span>
        <!-- 그림 제목 (직접 입력 및 수정 가능) -->
        <h2 class="modal-title" id="modalTitle">작품 제목</h2>
      </div>

      <div class="modal-body">
        <div class="modal-image-box">
          <img id="modalImage" src="" alt="손그림 확대" class="modal-image">
        </div>

        <div class="modal-text-section">
          <div class="story-header-group">
            <h3 class="modal-block-title">📖 작품 소개</h3>
            <button id="modalEditBtn" class="story-edit-btn">✏️ 제목 & 글 작성/수정</button>
          </div>

          <!-- Display Mode -->
          <div id="storyDisplayBox" class="story-display-group">
            <div class="story-block">
              <h4 class="sub-block-title">📖 그림 관련 이야기</h4>
              <p class="modal-block-desc" id="modalStory"></p>
            </div>

            <div class="story-block teacher-block">
              <h4 class="sub-block-title">💬 선생님 추가 설명</h4>
              <p class="modal-block-desc" id="modalTeacherNote"></p>
            </div>
          </div>

          <!-- Interactive Input / Edit Area for Title, Student Story & Teacher Note -->
          <div class="story-edit-box" id="storyEditBox" style="display: none;">
            <div class="input-field-group">
              <label for="titleInput" class="input-label">🎨 그림 제목:</label>
              <input type="text" id="titleInput" class="title-input" placeholder="그림의 제목을 입력하세요 (예: 내가 그린 수박)">
            </div>

            <div class="input-field-group">
              <label for="storyInput" class="input-label">📖 그림 관련 이야기 (학생 작성):</label>
              <textarea id="storyInput" class="story-textarea" rows="2" placeholder="학생이 직접 키보드나 태블릿으로 작성하는 이야기입니다."></textarea>
            </div>

            <div class="input-field-group">
              <label for="teacherInput" class="input-label">💬 선생님 추가 설명 (선생님 작성):</label>
              <textarea id="teacherInput" class="story-textarea teacher-textarea" rows="2" placeholder="학생이 직접 글을 쓰기 어려울 때 선생님이 보충 설명을 적어주는 공간입니다."></textarea>
            </div>

            <div class="story-btn-group">
              <button id="storySaveBtn" class="story-save-btn">💾 저장하기</button>
              <button id="storyCancelBtn" class="story-cancel-btn">취소</button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript Scripts -->
  <script src="./js/data.js"></script>
  <script src="./js/student.js"></script>

</body>
</html>
