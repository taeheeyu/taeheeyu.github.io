<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>금천고등학교</title>
  <style>
    html, body { margin: 0; min-height: 100%; }
    body { display: grid; min-height: 100vh; place-items: center; background: #fff; }
    a { display: block; line-height: 0; }
    img { display: block; width: min(100vw, 1672px); height: auto; max-height: 100vh; object-fit: contain; }
    .cherry-blossom-layer { position: fixed; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
    .cherry-petal { --petal-color: #f7b7c6; position: absolute; top: -32px; left: var(--left); width: var(--size); height: calc(var(--size) * .76); border-radius: 75% 15% 75% 15%; background: var(--petal-color); box-shadow: inset -2px -2px 2px rgba(202, 92, 122, .18); opacity: .8; animation: cherry-petal-fall var(--duration) linear var(--delay) infinite; }
    .cherry-petal:nth-child(3n) { --petal-color: #ffd4df; opacity: .9; }
    .cherry-petal:nth-child(4n) { --petal-color: #ee9eb3; opacity: .7; }
    @keyframes cherry-petal-fall { 0% { transform: translate3d(0, -12vh, 0) rotate(0deg); } 35% { transform: translate3d(calc(var(--drift) * .65), 30vh, 0) rotate(185deg); } 70% { transform: translate3d(calc(var(--drift) * .25), 68vh, 0) rotate(395deg); } 100% { transform: translate3d(var(--drift), 115vh, 0) rotate(600deg); } }
    @media (prefers-reduced-motion: reduce) { .cherry-petal { animation: none; opacity: 0; } }
  </style>
</head>
<body>
  <a href="main.html" aria-label="학급 소개 메인 페이지로 이동">
    <img src="images/main%20group%20image.png" alt="금천고등학교 학급 소개">
  </a>
  <div class="cherry-blossom-layer" aria-hidden="true">
    <span class="cherry-petal" style="--left: 4%; --size: 12px; --duration: 12s; --delay: -8s; --drift: 18vw;"></span>
    <span class="cherry-petal" style="--left: 11%; --size: 9px; --duration: 15s; --delay: -3s; --drift: 28vw;"></span>
    <span class="cherry-petal" style="--left: 19%; --size: 14px; --duration: 13s; --delay: -11s; --drift: 13vw;"></span>
    <span class="cherry-petal" style="--left: 28%; --size: 10px; --duration: 16s; --delay: -6s; --drift: 24vw;"></span>
    <span class="cherry-petal" style="--left: 36%; --size: 13px; --duration: 11s; --delay: -1s; --drift: 17vw;"></span>
    <span class="cherry-petal" style="--left: 45%; --size: 8px; --duration: 14s; --delay: -9s; --drift: 31vw;"></span>
    <span class="cherry-petal" style="--left: 54%; --size: 15px; --duration: 17s; --delay: -4s; --drift: 11vw;"></span>
    <span class="cherry-petal" style="--left: 63%; --size: 10px; --duration: 12s; --delay: -10s; --drift: 26vw;"></span>
    <span class="cherry-petal" style="--left: 71%; --size: 12px; --duration: 15s; --delay: -7s; --drift: 14vw;"></span>
    <span class="cherry-petal" style="--left: 80%; --size: 9px; --duration: 13s; --delay: -2s; --drift: 22vw;"></span>
    <span class="cherry-petal" style="--left: 88%; --size: 14px; --duration: 16s; --delay: -12s; --drift: 8vw;"></span>
    <span class="cherry-petal" style="--left: 96%; --size: 11px; --duration: 11s; --delay: -5s; --drift: 19vw;"></span>
  </div>
</body>
</html>
